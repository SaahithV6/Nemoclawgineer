[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoclaw"
version = "0.1.0"
description = "Engineering orchestrator: CAD, FEA, CFD on Brev with OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "discord.py>=2.4.0",
  "mcp>=1.1.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
nemoclaw = "nemoclaw.cli:main"
nemoclaw-api = "nemoclaw.api:run_server"
nemoclaw-discord = "nemoclaw.discord_bot:main"
nemoclaw-doctor = "nemoclaw.doctor:main"
nemoclaw-mcp = "nemoclaw.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nemoclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
