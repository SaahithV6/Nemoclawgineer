[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw_engineering"
version = "0.2.0"
description = "AI engineering orchestrator: CAD, FEA, CFD on Brev with OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "mcp>=1.1.0",
  "jinja2>=3.1.4",
  "build123d>=0.8.0",
  "cadquery>=2.4.0",
  "optuna>=4.0.0",
  "pyvista>=0.44.0",
  "numpy>=1.26.0",
  "trimesh>=4.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
openclaw-engineering = "openclaw_engineering.cli:main"
openclaw-engineering-api = "openclaw_engineering.api:run_server"
openclaw-engineering-doctor = "openclaw_engineering.doctor:main"
openclaw-engineering-mcp = "openclaw_engineering.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw_engineering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
